name: CI

# Этап 12 (Q9): пуш в master гоняет юниты + e2e; ручной запуск — вкладка Actions.
# Репо публичный → GitHub Actions бесплатен. gh CLI не нужен.
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  unit:
    name: Юниты + статика
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version из packageManager в package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint # biome
      # Типы маршрутов Next (PageProps, next-env.d.ts) генерятся в .next/types —
      # в git их нет, без typegen tsc падает на страницах (найдено в CI, не локально)
      - run: pnpm exec next typegen
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec tsc -p ws-gateway --noEmit
      - run: pnpm test:unit

  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dev-инфраструктура (postgres :5560 / minio / mailpit)
        run: docker compose -f docker-compose.dev.yml up -d --wait
      - name: Chromium для Playwright
        run: pnpm exec playwright install chromium --with-deps
      - name: e2e (setup food_delivery_e2e → next build → прогон 11 сценариев)
        run: pnpm test:e2e
        env:
          CI: true # reuseExistingServer: false — webServers стартуют чистыми
      - name: Отчёт и трейсы при падении
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
