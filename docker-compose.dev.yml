# Dev-инфраструктура: postgres 17 + MinIO (S3) + Mailpit (SMTP-заглушка)
services:
  postgres:
    image: postgres:17-alpine
    container_name: food-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: food_delivery
    ports:
      - "5560:5432" # 5432 у этой машины зарезервирован WinNAT (5256-5555) — см. AGENTS.md §5.20
    volumes:
      - food-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d food_delivery"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: bitnamilegacy/minio:latest # minio/minio удалён с Docker Hub (2025) — см. AGENTS.md §5.19
    container_name: food-minio
    command: server /data --console-address ":9001"
    user: "0:0" # legacy-образ: named volume root-owned, non-root не может писать в /data (§5.19)
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - food-minio-data:/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: food-mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # UI
    volumes:
      - food-mailpit-data:/data

volumes:
  food-postgres-data:
  food-minio-data:
  food-mailpit-data:
